name: Run automated tests

on:
  pull_request:
    branches: [ master, '*-develop', 'mainline*' ]

jobs:
  build:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle-command: ./gradlew
            shell: bash
          - os: macos-latest
            gradle-command: ./gradlew
            shell: bash
          - os: windows-latest
            gradle-command: .\gradlew.bat
            shell: pwsh

    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Run automated tests
        run: ${{ matrix.gradle-command }} test check --no-daemon
        shell: ${{ matrix.shell }}

  static-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Qodana - Code Quality
        uses: JetBrains/qodana-action@v2025.3
        with:
          cache-default-branch-only: true
          use-caches: true
          args: '--baseline,qodana.sarif.json'
